<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sea Water Seafood - FishCop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER / NAVBAR -->
  <header class="navbar">
    <div class="logo">
      <a href="index.html">FishCop</a>
    </div>
    <nav>
      <a href="index.html" class="nav-link">← Home</a>
    </nav>
    <div class="cart-icon" id="cartBtn">
      🛒 <span id="cartCount">0</span>
    </div>
  </header>

  <!-- PAGE HEADER -->
  <section style="padding: 40px 20px 10px; max-width: 1200px; margin: 0 auto;">
    <h1 style="font-size: 28px; color: #0f172a;">Sea Water Seafood</h1>
    <p style="color: #64748b; font-size: 14px;">Freshly caught premium sea water fishes</p>
  </section>

  <!-- 8 SEA WATER PRODUCTS GRID -->
  <section class="products-section" style="padding: 20px;">
    <div class="product-grid" id="seaWaterGrid">
      <!-- Loaded dynamically via script.js -->
    </div>
  </section>

  <!-- CART SIDEBAR PANEL -->
  <div class="cart-panel" id="cartPanel">
    <div class="cart-header">
      <h3>Your Cart</h3>
      <button id="closeCart">&times;</button>
    </div>
    <div class="cart-items" id="cartItems">
      <p style="padding:15px; text-align:center;">Your cart is empty.</p>
    </div>
    <div class="cart-footer">
      <button class="add-btn" id="openCheckoutModal" style="width:100%; padding:12px;">Checkout on WhatsApp</button>
    </div>
  </div>

  <div class="overlay" id="overlay"></div>

  <!-- CHECKOUT MODAL -->
  <div class="customer-modal" id="customerModal" style="display:none;">
    <div class="modal-content">
      <span class="close-btn" id="closeModal">&times;</span>
      <h2>Enter Delivery Details</h2>
      <form id="orderForm">
        <input type="text" id="custName" placeholder="Full Name" required>
        <input type="tel" id="custPhone" placeholder="Phone Number" required>
        <textarea id="custAddress" placeholder="Full Delivery Address" required></textarea>
        <input type="text" id="custLandmark" placeholder="Landmark (Optional)">
        <button type="submit" class="add-btn" style="width:100%; margin-top:10px;">Place Order via WhatsApp</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
